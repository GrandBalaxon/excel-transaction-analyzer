[project]
name = "transactions-etl-pipeline"
version = "2.0.0"
description = "ETL pipeline that loads bank transactions from Excel into a PostgreSQL star schema."
authors = [
    {name = "Vlad Spinul",email = "shinokakaov@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
license = {text = "MIT"}
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
isort = "^6.0.1"
mypy = "^1.16.1"
flake8 = "^7.2.0"
pandas-stubs = ">=2.3.3,<2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"
coverage = "^7.17.3"

[tool.isort]
# maximum line length
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true
strict = true
warn_unreachable = true
exclude = 'venv'

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
