[project]
name = "excel-transaction-analyzer"
version = "0.1.0"
description = "Transaction analysis toolkit for Excel data."
authors = [
    {name = "Vlad Spinul",email = "shinokakaov@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
license = {text = "MIT"}
dependencies = [
    "poetry-core (>=2.0.0,<3.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
isort = "^6.0.1"
mypy = "^1.16.1"
flake8 = "^7.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true
strict = true
warn_unreachable = true
exclude = 'venv'
